version: "2"

run:
  # Anchor issue paths at the go.mod directory. The default anchors them at the
  # git root, which golangci finds by walking up for a .git *directory* -- in a
  # linked worktree .git is a file, so it walks past it into the parent clone
  # and every issue is reported against the parent's copy of the file. The
  # nolint processor then looks for directives at those line numbers in the
  # wrong file: the moment the two checkouts diverge, //nolint stops
  # suppressing and lint fails on code that passes in a plain checkout.
  relative-path-mode: gomod

linters:
  default: all
  enable:
    - gomodguard_v2
  disable:
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - funcorder
    - funlen
    - gochecknoglobals
    - gocognit
    - gocyclo
    - goconst
    - godox
    - gomodguard
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - misspell
    - mnd
    - nestif
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - prealloc
    - revive
    - tagalign
    - tagliatelle
    - testpackage
    - varnamelen
    - maintidx
    - wrapcheck
    - wsl
    - wsl_v5
  exclusions:
    rules:
      - linters:
          - gosec
        path: _test\.go
      # i18n message catalogs are translation data. Non-English catalogs
      # (Chinese/Japanese) contain Han ideographs in string values, which
      # gosmopolitan flags line-by-line; the whole package is locale data,
      # so exclude it rather than annotating every translated entry.
      - linters:
          - gosmopolitan
        path: src/i18n/
      # Same package, same reason, different linter. The catalog keys are
      # message-ID constants -- MsgAuthMissingToken, MsgAuthInvalidCredentials
      # -- and gosec's G101 matches that pattern for a hardcoded credential.
      # Whether it actually fires on a given entry depends on the Shannon
      # entropy of the *translated string*, so the same key is flagged in one
      # locale and not in another, and rewording a translation silently turns
      # a //nolint on that map into an unused directive that nolintlint then
      # fails on. Exclude the rule for the package instead of annotating maps
      # whose annotations expire on translation edits.
      - linters:
          - gosec
        path: src/i18n/
        text: G101
